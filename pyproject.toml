[project]
name = "trailsab-proc"
version = "1.0.0"
description = "Comprehensive analysis pipeline for digitized Trails A/B cognitive task data with parallel processing and advanced behavioral metrics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "SympatiCog Lab"}
]
keywords = ["neuropsychology", "trails-making-test", "cognitive-assessment", "behavioral-analysis", "parallel-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.3.2",
    "numpy>=2.3.2",
    "scipy>=1.14.0",
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "pingouin>=0.5.5",
    "scikit-learn>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.4.6",
    "pytest>=7.0.0",
]

[project.scripts]
trails-analyze = "run_analysis:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
